services:
  backend:
    image: zeccely/traintogether-backend:latest
    pull_policy: always
    container_name: ttbackend-e2e
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:e2e;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
    ports:
      - "8081:8080"
