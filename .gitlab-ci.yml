stages:
  - build

build:
  stage: build
  before_script:
    - git config --global core.longpaths true
    - pnpm install --global corepack@latest
    - corepack enable
    - corepack prepare pnpm@latest --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm run build

