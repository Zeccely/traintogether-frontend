stages:
  - build
  - publish

build:
  stage: build
  script:
    - pnpm install --frozen-lockfile
    - pnpm run build
publish:
  stage: publish
  script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_PATTOKEN"
    - docker build -t zeccely/traintogether-frontend:latest .
    - docker push zeccely/traintogether-frontend:latest
