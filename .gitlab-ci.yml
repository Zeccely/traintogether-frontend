stages:
  - build
  - test
  - e2e
  - publish
  - deploy

build:
  stage: build
  script:
    - pnpm install --frozen-lockfile
    - pnpm run build

test:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm run test -- --coverage

e2e:
  stage: e2e
  allow_failure: true
  variables:
    BACKEND_URL: "http://localhost:8080"
  before_script:
    - cd ~/traintogether-deploy
    - docker compose up -d backend
    - cd "$CI_PROJECT_DIR"
  script:
    - pnpm install --frozen-lockfile
    - pnpm exec playwright install chromium
    - pnpm e2e

publish:
  stage: publish
  script:
    - echo "52.55.137.78 registry-1.docker.io" | sudo tee -a /etc/hosts
    - echo "$DOCKERHUB_PATTOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -t zeccely/traintogether-frontend:latest .
    - docker push zeccely/traintogether-frontend:latest

deploy:
  stage: deploy
  script:
    - cd ~/traintogether-deploy
    - docker compose pull
    - docker compose up -d
  only:
    - main
